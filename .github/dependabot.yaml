version: 2
updates:
  # Acciones fijadas por SHA (con la versión en comentario): un PR semanal agrupado.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
    groups:
      github-actions:
        patterns: ["*"]

  # Imagen base de Homebox (FROM con etiqueta y digest). La versión del addon la
  # sube .github/workflows/homebox-version.yaml en el propio PR.
  - package-ecosystem: "docker"
    directory: "/homebox"
    schedule:
      interval: weekly
      time: "06:00"

  # Calibrador: imágenes base (python, uv) y dependencias Python (uv.lock).
  # Estos PR necesitan subir `version` a mano (lo avisa el Builder).
  - package-ecosystem: "docker"
    directory: "/filament_calibrator"
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ["*"]
    # Cambiar de Python (3.12 → 3.x) es una migración, no un bump rutinario:
    # solo parches/digest. (3.15 rompió el build: sin wheels.)
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "uv"
    directory: "/filament_calibrator"
    schedule:
      interval: monthly
    # Solo uv.lock: los rangos de pyproject.toml no se tocan.
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
