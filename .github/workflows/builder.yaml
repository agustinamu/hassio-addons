name: Builder

# Acciones componibles de home-assistant/builder (la acción home-assistant/builder
# está retirada: sus versiones > 2026.02.1 piden una imagen de builder que no existe).
# Basado en https://github.com/home-assistant/apps-example/blob/main/.github/workflows/builder.yaml

env:
  MONITORED_FILES: "config.yaml Dockerfile rootfs docker_entrypoint.sh run.sh"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_addons: ${{ steps.filter.outputs.changed_addons }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # git diff propio en lugar de tj-actions/changed-files (comprometida en 2025).
      - name: Get changed files
        id: changed_files
        run: |
          if [[ "${EVENT}" == "pull_request" ]]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" | tr '\n' ' ')
          else
            changed=$(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}" | tr '\n' ' ')
          fi
          echo "all=${changed}" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed add-ons
        id: filter
        env:
          ADDONS: ${{ steps.addons.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all }}
        run: |
          changed_addons=()
          # Si cambia el propio workflow se construyen todos (skip-existing evita
          # republicar versiones ya publicadas).
          if [[ "${CHANGED_FILES}" =~ \.github/workflows/(builder|build-addon)\.yaml ]]; then
            read -ra changed_addons <<< "${ADDONS}"
          else
            for addon in ${ADDONS}; do
              for file in ${MONITORED_FILES}; do
                if [[ "${CHANGED_FILES}" =~ ${addon}/${file} ]]; then
                  changed_addons+=("${addon}")
                  break
                fi
              done
            done
          fi
          if [[ ${#changed_addons[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_addons=$(jq -nc '$ARGS.positional' --args "${changed_addons[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No add-on had any monitored files changed (${MONITORED_FILES})"
          fi

  build:
    name: Build ${{ matrix.addon }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.init.outputs.changed_addons) }}
    uses: ./.github/workflows/build-addon.yaml
    with:
      addon: ${{ matrix.addon }}
      publish: ${{ github.event_name == 'push' }}
